[project]
name = "desktop-agent"
version = "0.1.0"
description = "Persistent local-first control plane for disposable AI workers"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pyyaml>=6", "httpx>=0.27"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
