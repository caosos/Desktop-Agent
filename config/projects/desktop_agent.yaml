# Project package for Desktop-Agent itself (the platform improving its own code).
name: desktop_agent
repo_path: ~/Desktop-Agent
remote_url: https://github.com/caosos/Desktop-Agent.git
github_repo: caosos/Desktop-Agent
integration_branch: main

start_here: START_HERE.md
agents_file: AGENTS.md
current_state: docs/PROJECT_STATE.md
acceptance: docs/IMPLEMENTATION_PLAN.md
state_entry_by: control        # the control plane records each verified task; workers never edit PROJECT_STATE.md

# The repo's own venv is gitignored; the verifier and workers use the one at the real checkout, read-only.
test_command: /home/caoscare-1/Desktop-Agent/.venv/bin/python -m pytest -q
test_env: {}

shared_contract_paths:
  - desktop_agent/control/events.py
  - desktop_agent/control/receipts.py
  - desktop_agent/control/contracts.py

never_read:
  - "config/runtime.yaml"
  - "**/token"
  - "**/widget.json"

runtime_ro_paths:
  - ~/Desktop-Agent/.venv

worker_allowed_tools:
  - Read
  - Glob
  - Grep
  - Edit
  - Write
  - MultiEdit
  - "Bash(git:*)"
  - "Bash(ls:*)"
  - "Bash(cat:*)"
  - "Bash(head:*)"
  - "Bash(tail:*)"
  - "Bash(grep:*)"
  - "Bash(find:*)"
  - "Bash(wc:*)"
  - "Bash(/home/caoscare-1/Desktop-Agent/.venv/bin/python:*)"
  - "Bash(python3:*)"

# Owner-instruction intake: issue #3 is the owner intake issue for this project; the control plane is the coordinator.
intake:
  issues: [3]
  owner_logins: [caosos]
  coordinator:
    kind: claude_peer
    session_name: caoscare-1-20                # this coordinator Claude session (pinned by name; shown on the card when it changes)
