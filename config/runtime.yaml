# Desktop-Agent runtime configuration (control-plane-local).
# Paths may use ~. Project descriptors are relative to this file.

data_dir: ~/.local/share/desktop-agent
workspaces_dir: ~/Desktop-Agent-work
token_file: ~/.config/desktop-agent/token

api:
  host: 127.0.0.1
  port: 8477

# Per-worker HOME gets copies of exactly these two files (OAuth credentials and
# the Claude Code config). Nothing else from the real HOME is visible.
worker_home:
  credentials: ~/.claude/.credentials.json
  claude_config: ~/.claude.json
  files:                                   # extra per-worker HOME files (Codex auth + config)
    - {from: ~/.codex/auth.json, to: .codex/auth.json}
    - {from: ~/.codex/config.toml, to: .codex/config.toml}

sandbox:
  bwrap: true
  systemd_scope: true
  # Read-only paths re-exposed inside the sandbox (the real HOME is hidden).
  ro_paths:
    - ~/.nvm            # node + the claude CLI

# systemd-run --user --scope limits per worker (ARCHITECTURE_REVIEW §7).
scope:
  memory_max: 3G
  cpu_quota: 200%
  runtime_max_sec: 3600
  nice: 10

# IMPLEMENTATION_PLAN §4. Stage 1 runs the admission formula with ceiling 1.
scheduler:
  ceiling: 2
  reserved_cores: 2
  cores_per_worker: 2
  host_reserve_mb: 4096
  mem_per_worker_mb: 1536   # admission estimate; the scope MemoryMax (3G) remains the hard cap
  hourly_cap_usd: 5.0
  daily_cap_usd: 20.0
  expected_cost_per_worker_hour_usd: 2.0
  stall_after_sec: 600
  tick_sec: 5

models:                                    # claude_headless (default adapter)
  cloud_cheap: claude-haiku-5-5
  cloud_strong: claude-sonnet-5-5
  cloud_max: claude-opus-5-5
adapter_models:
  codex_exec:                              # ChatGPT-subscription Codex; ids from ~/.codex/config.toml
    cloud_cheap: gpt-5.6-sol
    cloud_strong: gpt-5.6-sol
    cloud_max: gpt-5.6-sol

default_budget_usd: 3.0
default_max_turns: 60
test_port_range: [8100, 8199]
open_draft_pr: true

projects:
  - projects/caoscare.yaml
  - projects/desktop_agent.yaml
  - projects/michael_business_os.yaml

# Direct-API providers for the control plane's own calls (planner, Aria). Keys are read from
# a 0600 file (or the named env var) by the control-plane process only and never reach workers.
# `models` map class → model id. Fill OpenAI's ids after `python -m desktop_agent --check-providers`
# (a free GET /v1/models) shows which ids this key can use; leave null until then.
providers:
  openai:
    key_file: ~/.config/desktop-agent/openai.key
    env: OPENAI_API_KEY
    models:
      cloud_cheap: null
      cloud_strong: null
      cloud_max: null
  anthropic:
    key_file: ~/.config/desktop-agent/anthropic.key
    env: ANTHROPIC_API_KEY
    models:
      cloud_cheap: claude-haiku-5-5
      cloud_strong: claude-sonnet-5-5
      cloud_max: claude-opus-5-5

# First available backend wins. claude_cli is the subscription fallback (reports its own USD).
llm_backend_order: [openai_api, anthropic_api, claude_cli]

# USD per 1M tokens; a call on an unpriced model is recorded with tokens and an UNKNOWN cost.
# Owner-provided figures only; nothing here is estimated by the platform.
pricing: {}

# Owner-instruction intake: bounded free GitHub polling; tagged status comments on the issue.
intake:
  poll_sec: 120
  post_comments: true
